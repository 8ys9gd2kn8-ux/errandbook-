<header class="top"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg></div><div><b>ErrandBook</b><span>Price book · Quotes · Transport</span></div><div class="dt" id="dt"></div></header><main id="app"></main>
<nav id="nav"></nav>
<script>
const CATS=['Food','Beverages','Household products','Personal care','Cleaning products','Electronics','Clothing','Stationery','Pharmacy/health','Other'];
const FACTORS=['Manufacturer price change','Wholesale price change','Fuel/transport costs','Exchange-rate movement','Import costs','Taxes','Seasonal demand','Shortage','Weather','Production costs','Raw-material costs','Supplier change','Promotion/discount','Inflation','Market demand','Location difference'];
const CUR={code:'UGX',rate:1};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{n=n*CUR.rate;return CUR.code+' '+(Math.abs(n)<100&&n%1?n.toFixed(2):Math.round(n).toLocaleString('en-US'))};
const pc=n=>(n>0?'+':'')+n.toFixed(2)+'%';
const today=()=>new Date().toISOString().slice(0,10);
const dago=d=>{const x=new Date();x.setDate(x.getDate()-d);return x.toISOString().slice(0,10)};
let S={products:[],q:{lines:[],transport:0,fee:0,mode:'markup',val:15,customer:''}},V={v:'dash',pid:null,range:365,search:''};
function seed(){const mk=(d,p,s,l)=>({id:Math.random().toString(36).slice(2),date:dago(d),qty:1,price:p,supplier:s,loc:l,sell:0,notes:''});
S.products=[{id:'p1',name:'Coca-Cola 500ml',brand:'Coca-Cola',cat:'Beverages',pkg:'Carton',count:24,size:500,unit:'ml',manufacturer:'Century Bottling Co.',barcode:'',purchases:[mk(270,25000,'Owino Wholesale','Kampala'),mk(180,27000,'Owino Wholesale','Kampala'),mk(90,28000,'Nakasero Market','Kampala'),mk(0,30000,'Owino Wholesale','Kampala')],factors:[{id:'f1',text:'Transport costs increased',confirmed:false}]}]}
function load(){try{const r=localStorage.getItem('eb1');if(r){S=JSON.parse(r);return}}catch(e){}seed()}
function save(){try{localStorage.setItem('eb1',JSON.stringify(S))}catch(e){}}
// ---- analytics
const sorted=p=>{const r=p.purchases.filter(x=>!x.quoted);return[...(r.length?r:p.purchases)].sort((a,b)=>a.date.localeCompare(b.date))};
function stats(p){const h=sorted(p),n=h.length,pr=h.map(x=>x.price);if(!n)return{n:0};
 const cur=pr[n-1],prev=n>1?pr[n-2]:null,avg=pr.reduce((a,b)=>a+b,0)/n;
 const ch=[];for(let i=1;i<n;i++)ch.push((pr[i]-pr[i-1])/pr[i-1]*100);
 const am=ch.length?ch.reduce((a,b)=>a+b,0)/ch.length:0,sd=ch.length>1?Math.sqrt(ch.reduce((a,b)=>a+(b-am)**2,0)/(ch.length-1)):0;
 return{n,h,cur,prev,min:Math.min(...pr),max:Math.max(...pr),avg,diff:prev==null?null:cur-prev,pct:prev==null?null:(cur-prev)/prev*100,am,sd,ch,last:h[n-1]}}
function units(p,price){const L=[['Per '+p.pkg.toLowerCase(),price]];const c=+p.count||1;
 const it=p.item||'piece';if(c>1)L.push(['Per '+it,price/c]);if(c===12||c===24)L.push(['Per dozen '+it+'s',price/(c/12)]);
 const s=+p.size||0;let base=null;
 if(s&&(p.unit==='ml'||p.unit==='l')){const li=c*s*(p.unit==='l'?1:.001);base=li;L.push(['Total volume',null,li.toFixed(2)+' L']);L.push(['Per litre',price/li]);L.push(['Per millilitre',price/li/1000])}
 if(s&&(p.unit==='g'||p.unit==='kg')){const kg=c*s*(p.unit==='kg'?1:.001);L.push(['Total weight',null,kg.toFixed(2)+' kg']);L.push(['Per kg',price/kg]);L.push(['Per gram',price/kg/1000])}
 return L}
function trendWord(st){if(st.n<3)return'Insufficient data for reliable trend analysis.';return st.am>1?'Trending up':st.am<-1?'Trending down':'Relatively stable'}
const flag=st=>st.pct==null?'—':st.pct>0?'▲ Increased':st.pct<0?'▼ Decreased':'● Unchanged';
const cls=v=>v>0?'up':v<0?'dn':'';
// ---- chart
function chart(p){const st=stats(p);let pts=st.h.filter(x=>V.range==0||x.date>=dago(V.range));
 if(pts.length<2)return'<p class="mu">Not enough purchases in this period to draw a chart.</p>';
 const W=320,H=170,pad=28,pr=pts.map(x=>x.price),mn=Math.min(...pr,st.avg)*.97,mx=Math.max(...pr,st.avg)*1.03;
 const t0=new Date(pts[0].date),t1=new Date(pts[pts.length-1].date),span=(t1-t0)||1;
 const X=d=>pad+(new Date(d)-t0)/span*(W-pad-10),Y=v=>H-pad-(v-mn)/(mx-mn)*(H-pad-12);
 let s=`<svg viewBox="0 0 ${W} ${H}"><line x1="${pad}" x2="${W-6}" y1="${Y(st.avg)}" y2="${Y(st.avg)}" stroke="currentColor" opacity=".4" stroke-dasharray="4 3"/><text x="${W-6}" y="${Y(st.avg)-3}" font-size="8" text-anchor="end" fill="currentColor" opacity=".7">avg ${Math.round(st.avg).toLocaleString()}</text>`;
 const up=pr[pr.length-1]>=pr[0];s+=`<polyline fill="none" stroke="${up?'var(--up)':'var(--dn)'}" stroke-width="2" points="${pts.map(x=>X(x.date)+','+Y(x.price)).join(' ')}"/>`;
 pts.forEach((x,i)=>{const prv=i?pts[i-1].price:x.price,c=x.price>prv?'var(--up)':x.price<prv?'var(--dn)':'var(--mu)',pp=i?(x.price-prv)/prv*100:null;
  s+=`<circle cx="${X(x.date)}" cy="${Y(x.price)}" r="3.5" fill="${c}"/>`+(pp!=null?`<text x="${X(x.date)}" y="${Y(x.price)-7}" font-size="8" text-anchor="middle" fill="${c}">${pc(pp)}</text>`:'')+`<text x="${X(x.date)}" y="${H-12}" font-size="7.5" text-anchor="middle" fill="currentColor" opacity=".7">${x.date.slice(5)}</text>`});
 s+=`<text x="2" y="${Y(Math.max(...pr))+3}" font-size="8" fill="currentColor">H ${Math.max(...pr)/1000}k</text><text x="2" y="${Y(Math.min(...pr))+3}" font-size="8" fill="currentColor">L ${Math.min(...pr)/1000}k</text></svg>`;return s}
// ---- views
function dash(){const a=S.products.map(p=>({p,s:stats(p)}));const ch=a.filter(x=>x.s.pct!=null);
 const inc=ch.filter(x=>x.s.pct>0.5),dec=ch.filter(x=>x.s.pct<-0.5),stb=ch.filter(x=>Math.abs(x.s.pct)<=0.5),few=a.filter(x=>x.s.n<3);
 const avgm=ch.length?ch.reduce((t,x)=>t+x.s.pct,0)/ch.length:0;
 const al=[];a.forEach(({p,s})=>{if(s.pct>0.5)al.push(`<div class="alert"><b>${esc(p.name)}</b>: price increased ${s.pct.toFixed(1)}% since your last purchase.</div>`);if(s.pct<-0.5)al.push(`<div class="alert g"><b>${esc(p.name)}</b>: price dropped ${Math.abs(s.pct).toFixed(1)}% since your last purchase.</div>`);if(s.n>=3&&s.cur>s.avg*1.02)al.push(`<div class="alert"><b>${esc(p.name)}</b> is currently above its historical average.</div>`);if(s.n===1)al.push(`<div class="alert n"><b>${esc(p.name)}</b>: only one recorded purchase, so the trend is unreliable.</div>`)});
 const mv=(arr,sg)=>arr.sort((x,y)=>sg*(y.s.pct-x.s.pct)).slice(0,3).map(x=>`<div class="row"><a href="#" onclick="openP('${x.p.id}');return false">${esc(x.p.name)}</a><b class="${cls(x.s.pct)}">${pc(x.s.pct)}</b></div>`).join('')||'<span class="mu">None yet</span>';
 const rec=S.products.flatMap(p=>p.purchases.map(x=>({p,x}))).filter(r=>!r.x.quoted).sort((a,b)=>b.x.date.localeCompare(a.x.date)).slice(0,5);
 return`<h1>Dashboard</h1><div class="grid g3"><div class="card stat"><b>${S.products.length}</b><span>Products tracked</span></div><div class="card stat"><b class="up">${inc.length}</b><span>Prices up</span></div><div class="card stat"><b class="dn">${dec.length}</b><span>Prices down</span></div><div class="card stat"><b>${stb.length}</b><span>Stable</span></div><div class="card stat"><b>${few.length}</b><span>Insufficient data (&lt;3)</span></div><div class="card stat"><b class="${cls(avgm)}">${pc(avgm)}</b><span>Avg latest movement</span></div></div>
 ${salesCard()}${catChart()}${demandCard()}<div class="card"><h2>Alerts</h2>${al.join('')||'<span class="mu">No alerts.</span>'}</div>
 <div class="card"><h2>Biggest increases</h2>${mv(inc,1)}</div><div class="card"><h2>Biggest decreases</h2>${mv(dec,-1)}</div>
 ${accCard()}${discCard(S.products,'Supplier discounts compared')}<div class="card"><h2>Recent purchases</h2>${rec.map(r=>`<div class="row"><span>${esc(r.p.name)}<br><span class="mu">${r.x.date} · ${esc(r.x.supplier)}</span></span><b>${money(r.x.price)}</b></div>`).join('')||'<span class="mu">No purchases yet.</span>'}</div>${backupCard()}`}
function prods(){const q=V.search.toLowerCase();const L=S.products.filter(p=>[p.name,p.brand,p.cat,p.pkg,p.manufacturer,p.barcode,...p.purchases.map(x=>x.supplier)].join(' ').toLowerCase().includes(q));
 return`<h1>Products</h1><input id="sq" placeholder="Search name, brand, barcode, category, supplier…" value="${esc(V.search)}" oninput="V.search=this.value;$('#pl').innerHTML=plist()"><div id="pl">${plist()}</div>`;}
function plist(){const q=V.search.toLowerCase();return S.products.filter(p=>[p.name,p.brand,p.cat,p.pkg,p.manufacturer,p.barcode,...p.purchases.map(x=>x.supplier)].join(' ').toLowerCase().includes(q)).map(p=>{const s=stats(p);return`<div class="card" onclick="openP('${p.id}')" style="cursor:pointer"><div class="row" style="border:0;padding:0"><div><b>${esc(p.name)}</b><br><span class="mu">${esc(p.brand)} · ${esc(p.cat)} · ${esc(p.pkg)} of ${p.count}</span></div><div style="text-align:right"><b>${s.n?money(s.cur):'—'}</b><br><span class="${cls(s.pct)}" style="font-size:12.5px">${s.pct==null?'':pc(s.pct)}</span></div></div></div>`}).join('')||'<p class="mu">No products found.</p>'}
function openP(id){V.pid=id;V.v='prod';render()}
function prod(){const p=S.products.find(x=>x.id===V.pid);if(!p)return'';const s=stats(p);
 const rg=[[7,'7D'],[30,'30D'],[90,'3M'],[180,'6M'],[365,'1Y'],[0,'All']].map(r=>`<button class="btn ${V.range==r[0]?'':'s'}" onclick="V.range=${r[0]};render()">${r[1]}</button>`).join('');
 const sup={};s.h.forEach(x=>{const k=x.supplier||'Unknown';if(!sup[k]||x.date>=sup[k].date)sup[k]=x});const sl=Object.entries(sup).sort((a,b)=>a[1].price-b[1].price);
 let out='';if(s.n<3)out='<div class="est"><b>ESTIMATE</b><br>Insufficient data for reliable trend analysis (need at least 3 purchases).</div>';
 else{const sc=[['Lower-price scenario',s.am-s.sd],['Normal scenario',s.am],['Higher-price scenario',s.am+s.sd]];out=`<div class="est"><b>ESTIMATES / ASSUMPTIONS – not confirmed prices</b>${sc.map(x=>`<div class="row"><span>${x[0]}<br><span class="mu">${pc(x[1])} next change</span></span><b>${money(s.cur*(1+x[1]/100))}</b></div>`).join('')}<p class="mu" style="margin:6px 0 0">Based on ${s.n} recorded purchases and an average historical change of ${pc(s.am)} per purchase (std. deviation ${s.sd.toFixed(2)} pts). Low/high = average ∓ one standard deviation. Past prices do not guarantee future prices.</p></div>`}
 return`<a href="#" onclick="V.v='prods';render();return false">← Products</a><h1>${esc(p.name)}</h1><button class="btn" style="margin-bottom:12px" onclick="V.pre='${p.id}';V.v='add';render();scrollTo(0,0)">+ Add purchase</button>
 ${s.h.every(x=>x.quoted)?'<div class="alert n">This price comes from a customer quote, not an actual purchase. Treat it as unconfirmed until you buy it.</div>':''}<div class="card"><span class="mu">${esc(p.brand)} · ${esc(p.cat)} · ${esc(p.pkg)}: ${p.count} × ${p.size||''}${p.unit==='pc'?'':p.unit}${p.manufacturer?' · Mfr: '+esc(p.manufacturer):''}</span>

function calc(){const q=S.q,el=$('#qr');if(!el)return;let cost=0,items=[];q.lines.forEach(l=>{const p=S.products.find(x=>x.id===l.pid);if(!p)return;const s=stats(p),t=s.cur*l.qty;cost+=t;items.push({n:p.name,q:l.qty,c:t,u:s.h.every(x=>x.quoted)})});
 const tc=cost+q.transport;let profit=q.mode==='markup'?tc*q.val/100:q.mode==='fixed'?q.val:(q.val>=100?0:tc/(1-q.val/100)-tc);const sell=tc+profit,total=sell+q.fee;
 const markup=tc?profit/tc*100:0,margin=sell?profit/sell*100:0;
 const share=items.map(i=>{const share=cost?i.c/cost:0;return`${i.q} × ${i.n} — ${money(i.c+(q.transport*share)+profit*share)}`}).join('\n');
 const msg=`Hello${q.customer?' '+q.customer:''}, your order:\n\n${share}\n\nErrand fee — ${money(q.fee)}\n\nTotal — ${money(total)}`;
 q.total=total;q.profit=profit;if(q.status==='draft')save();window.__msg=msg;el.innerHTML=`<h2>Summary</h2><div class="row"><span>Product cost</span><b>${money(cost)}</b></div><div class="row"><span>Transport/delivery</span><b>${money(q.transport)}</b></div><div class="row"><span>Total cost</span><b>${money(tc)}</b></div><div class="row"><span>Expected profit</span><b class="dn">${money(profit)}</b></div><div class="row"><span>Markup (profit ÷ cost)</span><b>${markup.toFixed(2)}%</b></div><div class="row"><span>Margin (profit ÷ selling price)</span><b>${margin.toFixed(2)}%</b></div><div class="row"><span>Items price to customer</span><b>${money(sell)}</b></div><div class="row"><span>Errand fee</span><b>${money(q.fee)}</b></div><div class="row"><span><b>Customer pays</b></span><b style="font-size:18px">${money(total)}</b></div>
 <p class="mu">Uses each product's latest recorded purchase price. Errand fee is charged on top of the profit shown.</p>${items.some(i=>i.u)?'<p class="mu">⚠ Includes prices from quotes that no purchase has confirmed yet.</p>':''}<pre>${esc(msg)}</pre><a class="btn wa" target="_blank" rel="noopener" onclick="markSent()" href="https://wa.me/?text=${encodeURIComponent(msg)}">Share on WhatsApp</a> <button class="btn s" onclick="try{navigator.clipboard.writeText(window.__msg);this.textContent='Copied'}catch(e){}">Copy</button>`}

function discCard(ps,t){const m={};ps.forEach(p=>p.purchases.forEach(x=>{const k=x.supplier||'Unknown',o=m[k]=m[k]||{n:0,d:0,pct:0,tot:0,r:''};o.n++;const l=x.list||x.price;if(x.disc>0){o.d++;o.tot+=x.disc*x.qty;if(x.reason)o.r=x.reason}o.pct+=((x.disc||0)/l*100)}));
 const L=Object.entries(m).filter(e=>e[1].d).sort((a,b)=>b[1].pct/b[1].n-a[1].pct/a[1].n);
 return`<div class="card"><h2>${t}</h2>`+(L.length?L.map((e,i)=>`<div class="row"><span>${esc(e[0])}${i===0&&L.length>1?' <span class="pill dn">Most generous</span>':''}<br><span class="mu">${e[1].d} of ${e[1].n} purchases discounted${e[1].r?' · last reason: '+esc(e[1].r):''}</span></span><span style="text-align:right"><b>${(e[1].pct/e[1].n).toFixed(1)}%</b> avg<br><span class="mu">saved ${money(e[1].tot)}</span></span></div>`).join(''):'<span class="mu">No discounts recorded yet.</span>')+'</div>'}
function catChart(){V.cr=V.cr==null?0:V.cr;const m={};S.products.forEach(p=>{const h=sorted(p).filter(x=>!V.cr||x.date>=dago(V.cr));if(h.length<2)return;(m[p.cat]=m[p.cat]||[]).push((h[h.length-1].price-h[0].price)/h[0].price*100)});
 const L=Object.entries(m).map(([k,a])=>[k,a.reduce((t,v)=>t+v,0)/a.length,a.length]).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...L.map(x=>Math.abs(x[1])));

function lockPlan(id){const p=S.products.find(x=>x.id===id),g=i=>+$('#pl_'+i).value,b=$('#pl_b').value,base=b==='h'?g('h'):g('n');if(!(base>0)){alert('Enter valid anticipated prices.');return}
 (p.plans=p.plans||[]).push({id:Math.random().toString(36).slice(2),date:today(),n:p.purchases.length,low:g('l'),normal:g('n'),high:g('h'),comm:g('c'),base:b,charge:Math.round(base*(1+g('c')/100))});save();render()}

function tracking(p){const L=(p.plans||[]).slice().reverse();if(!L.length)return'';

 if(!a)h+='<span class="mu">Waiting for your next purchase of this product.</span>';else{const c=a.price,ok=c>=pl.low&&c<=pl.high,ap=pl.charge-base,rp=pl.charge-c;h+=`Actual cost ${money(c)}: <b class="${ok?'dn':'up'}">${ok?'within anticipated range':c<pl.low?'below range (cheaper)':'above range'}</b><br>Anticipated profit ${money(ap)} · actual profit <b class="${rp>=ap?'dn':'up'}">${money(rp)}</b> (${money(rp-ap)} vs plan)`}

function places(){const s=new Set();S.trips.forEach(t=>{s.add(t.from);s.add(t.to)});S.products.forEach(p=>p.purchases.forEach(x=>x.loc&&s.add(x.loc)));return[...s].filter(Boolean)}

function demandCard(){const ds=S.quotes.filter(q=>q.status!=='cancelled'&&q.lines.length).map(q=>q.created).sort();

function qTot(q){let cost=0;const items=[];q.lines.forEach(l=>{const p=S.products.find(x=>x.id===l.pid);if(!p)return;const s=stats(p),t=s.cur*l.qty;cost+=t;items.push({pid:p.id,n:p.name,q:l.qty,c:t,sup:s.last?s.last.supplier:''})});
 const tc=cost+(q.transport||0),profit=q.mode==='markup'?tc*q.val/100:q.mode==='fixed'?q.val:(q.val>=100?0:tc/(1-q.val/100)-tc);return{items,cost,tc,profit,total:tc+profit+(q.fee||0)}}
function recordSale(q){if(q.sale)return;const t=qTot(q);q.sale={date:q.sentAt||today(),customer:q.customer,revenue:t.total,cost:t.tc,profit:t.total-t.tc,items:t.items};
 q.lines.forEach(l=>{const p=S.products.find(x=>x.id===l.pid);if(p)p.purchases.forEach(x=>{if(x.quoted&&!x.fulfilled){x.sentq=true;x.qty=l.qty}})})}
function revertSale(q){if(q.sale)q.sale.items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);if(p)p.purchases.forEach(x=>{if(x.quoted)x.sentq=false})});q.sale=null}
function salesCard(){const L=S.quotes.filter(q=>q.sale).sort((a,b)=>b.sale.date.localeCompare(a.sale.date)),r=L.reduce((a,q)=>a+q.sale.revenue,0),pf=L.reduce((a,q)=>a+q.sale.profit,0);
 return`<div class="card"><h2>Sales (sent quotes)</h2>`+(L.length?`<div class="grid"><div class="stat"><b>${money(r)}</b><span>Revenue</span></div><div class="stat"><b class="dn">${money(pf)}</b><span>Profit (incl. errand fees)</span></div></div>`+L.slice(0,5).map(q=>`<div class="row" style="cursor:pointer" onclick="S.qid='${q.id}';V.v='qedit';render()"><span>${esc(q.no)}${q.customer?' · '+esc(q.customer):''}<br><span class="mu">${q.sale.date} · ${q.sale.items.length} item${q.sale.items.length!==1?'s':''}</span></span><span style="text-align:right"><b>${money(q.sale.revenue)}</b><br><span class="mu dn">+${money(q.sale.profit)}</span></span></div>`).join(''):'<p class="mu">A sale is recorded automatically when you send a quote.</p>')+'</div>'}

function lastSup(p){const x=[...p.purchases].reverse().find(y=>y.supplier&&y.supplier!=='Quote (unconfirmed)');return x?{s:x.supplier,l:x.loc||''}:{s:'',l:''}}
const blankSup=x=>!(x.supplier||'').trim()||x.supplier.trim().toLowerCase()==='unknown';
function assignCard(){return`<div class="card"><h2>Assign these purchases to a supplier</h2><p class="mu">Purchases saved without a supplier land here. Type the supplier's name to move them all into that account.</p><datalist id="sl3">${Object.values(supMap()).filter(o=>o.k!=='unknown').map(o=>`<option value="${esc(o.name)}">`).join('')}</datalist><input id="as_n" list="sl3" placeholder="Supplier name"><button class="btn" onclick="assignSup()">Move purchases</button></div>`}
function assignSup(){const n=$('#as_n').value.trim();if(!n){alert('Type the supplier name.');return}S.products.forEach(p=>p.purchases.forEach(x=>{if(!x.quoted&&blankSup(x))x.supplier=n}));if(!S.suppliers.some(z=>z.name.trim().toLowerCase()===n.toLowerCase()))S.suppliers.push({id:uid(),name:n,loc:''});save();V.sup=n.toLowerCase();render()}

function backupCard(){return`<div class="card"><h2>Backup &amp; restore</h2><p class="mu">Your data lives only on this device. Copy a backup now and then; paste it into the app on another device to restore.</p><button class="btn s" onclick="copyBackup()">Copy backup</button> <button class="btn s" onclick="dlBackup()">Download file</button><label style="display:block;margin-top:12px">Paste a backup to restore</label><textarea id="bk" rows="3"></textarea><button class="btn" onclick="restoreBackup()">Restore</button></div>`}
function copyBackup(){const t=JSON.stringify(S);if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>note('Backup copied. Paste it somewhere safe.'),()=>note('Copy blocked – try Download file.'));else note('Copy not available here.')}
function dlBackup(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='errandbook-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){note('Download not available here – use Copy backup.')}}
function restoreBackup(){const t=$('#bk').value.trim();let d;try{d=JSON.parse(t);if(!d.products)throw 0}catch(e){note('That does not look like a valid backup.');return}ask('Replace everything in this app with the backup?',()=>{try{localStorage.setItem('eb1',JSON.stringify(d))}catch(e){}location.reload()},'Restore')}
function render(){const m={dash,prods,prod,add,quote,qedit,trans,tdet,tform,sups,supdet}[V.v];$('#app').innerHTML=m();if(V.v==='add'&&V.pre){const pp=S.products.find(x=>x.id===V.pre);V.pre=null;if(pp){$('#a_name').value=pp.name;fillP()}}if(V.v==='qedit')calc();
 const tabs=[['dash','home','Home'],['prods','box','Products'],['add','plus','Add'],['quote','doc','Quotes'],['trans','truck','Transport'],['sups','store','Suppliers']];
 try{$('#dt').innerHTML=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).replace(/,/,'<br>')}catch(e){}$('#nav').innerHTML=tabs.map(t=>`<button class="${V.v===t[0]||(V.v==='prod'&&t[0]==='prods')||(['tdet','tform'].includes(V.v)&&t[0]==='trans')||(V.v==='supdet'&&t[0]==='sups')||(V.v==='qedit'&&t[0]==='quote')?'on':''}" onclick="V.v='${t[0]}';render();scrollTo(0,0)"><i><svg viewBox="0 0 24 24">${IC[t[1]]}</svg></i>${t[2]}</button>`).join('');}
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});load();S.trips=S.trips||[];S.suppliers=S.suppliers||[];S.quotes=S.quotes||[];{const oq=S.q;delete S.q;if(oq&&oq.lines&&oq.lines.length&&!S.quotes.length){const q=newQ(oq);S.quotes.push(q);S.qid=q.id}}Object.defineProperty(S,'q',{get(){return this.quotes.find(x=>x.id===this.qid)||null},configurable:true});S.quotes.filter(q=>q.status==='sent'&&!q.sale).forEach(recordSale);save();render();
</script><script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});</script></body></html>
